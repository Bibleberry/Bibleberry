# Bibleberry — LOCAL-ONLY Supabase CLI configuration (R13-SB1, Issue #210).
#
# Purpose: start a disposable, loopback-only local stack (PostgreSQL + GoTrue + PostgREST + Kong)
# to prove the accepted account migrations under the real Supabase runtime.
#
# Safety rules (see docs/testing/r13-sb1-real-local-supabase-security-acceptance.md):
#   - Never `supabase link`, `supabase login`, `db push`, or any `--linked` / `--remote` / `--db-url` path.
#   - Use scripts/accountSupabase/run-local-supabase-acceptance.sh, which refuses non-loopback targets.
#   - The ports below are deliberately NOT the CLI defaults (543xx) so this stack cannot collide with
#     another local Supabase project on the same machine.
#   - Only services needed for the acceptance run are enabled; everything else stays off.

project_id = "bibleberry-sb1-local"

[api]
enabled = true
port = 55421
# `public` is the only application schema exposed through the Data API. `account_issuance` and
# `account_private` must never be added here (R13-VERIFY1 §2.4).
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = false

[db.seed]
# No seed data: every fixture is created by the acceptance tests themselves.
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enabled = true
# Synthetic local test users sign in with a password immediately; no mail delivery is involved.
enable_confirmations = false
