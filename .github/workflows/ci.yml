
name: Bibleberry CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reader-app:
    name: Build reader application
    # Pin to the established runner while ubuntu-latest migrates to Ubuntu 26.04.
    # Playwright --with-deps was failing DNS/package downloads on resolute.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # Runner image supplies OS libraries; avoid apt mirrors during browser provisioning.
        # The reader smoke suite still launches actual Chromium and fails if runtime libraries are missing.
        run: npx playwright install chromium

      - name: Lint application
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Verify Staging Worker compilation (dry-run)
        run: npm run check:staging

      - name: Run reader regression smoke suite
        run: npm run test:smoke

      - name: Upload smoke test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: test-results/
          retention-days: 7

  cms-adapter-tests:
    name: Verify CMS adapters and BerryMark preview
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CMS adapter and BerryMark preview tests
        run: npm run test:adapter

  release-gateway-tests:
    name: Verify Release Gateway core
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Release Gateway tests
        run: npm run test:gateway

  sanity-studio:
    name: Verify Sanity Studio
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run schema validation tests
        run: npm run test:schema

      - name: TypeScript check
        run: npm run typecheck

      - name: Build Studio
        run: npm run build
