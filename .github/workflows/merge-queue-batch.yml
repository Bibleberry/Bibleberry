name: Copper Turnstile Batch Coordinator

# Trusted default-branch control plane ONLY.
# - No ordinary `pull_request` trigger: PR-branch workflow edits never execute.
# - `pull_request_target`, `workflow_run`, and `schedule` always run workflow YAML from `main`.
# - Privileged credentials live ONLY in the `main`-branch-restricted `copper-turnstile-runtime`
#   environment (never as repository-level secrets), so hostile same-repo PR workflows are
#   blocked server-side by GitHub's Environment deployment branch policy.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Coordinator action to perform
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - start
          - status
          - reconcile
          - abort
      entries:
        description: Ordered PR_NUMBER@REVIEWED_HEAD_SHA#REVIEW_COMMENT_ID list (comma or newline separated)
        type: string
        required: false
      merge_method:
        description: Protected PR merge method (must be allowed by repository settings)
        type: choice
        required: false
        default: squash
        options:
          - squash
          - merge
          - rebase
      reason:
        description: Optional reason (used for abort/cancellation)
        type: string
        required: false
  pull_request_target:
    # Treated strictly as a wakeup signal. Never checks out PR code or interpolates untrusted PR strings.
    types: [closed, synchronize]
    branches: [main]
  workflow_run:
    # Reliable immediate wakeup when ordinary PR CI completes (excludes coordinator itself to prevent recursion).
    # Treated strictly as a wakeup signal; never downloads or consumes workflow artifacts.
    workflows:
      - Bibleberry CI
      - Collections Browser Tests
      - Native Android debug build
      - Native iOS simulator build
      - PR Assignment Identity
    types: [completed]
  schedule:
    # Recovery watchdog fallback for missed webhooks or interrupted API calls (zero runners when idle).
    - cron: '*/15 * * * *'

permissions: {}

jobs:
  preflight:
    name: Preflight batch entries (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.action == 'dry-run' || inputs.action == 'start') }}
    concurrency:
      group: merge-queue-readonly-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate batch entries (zero writes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_ENTRIES: ${{ inputs.entries }}
          MERGE_METHOD: ${{ inputs.merge_method || 'squash' }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts preflight

  approve-start:
    name: Owner approval gate for batch start
    needs: [preflight]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'start' && github.ref == 'refs/heads/main' && github.actor == 'ContraPhilosophy' }}
    runs-on: ubuntu-24.04
    environment: merge-queue-approval
    permissions: {}
    steps:
      - name: Record owner approval checkpoint
        run: echo "Owner approval gate satisfied for workflow run ${GITHUB_RUN_ID}."

  authorize-and-start:
    name: Authorize and start direct-merge batch
    needs: [preflight, approve-start]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'start' && github.ref == 'refs/heads/main' && github.actor == 'ContraPhilosophy' }}
    concurrency:
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment: copper-turnstile-runtime
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Detect configured runtime credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Copper Turnstile runtime credential configured in the main-only copper-turnstile-runtime environment. See docs/testing/merge-queue-integration.md."
            exit 1
          fi
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Emit immutable start-run authorization manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          BATCH_ENTRIES: ${{ inputs.entries }}
          MERGE_METHOD: ${{ inputs.merge_method || 'squash' }}
          MANIFEST_OUT: ${{ runner.temp }}/copper-turnstile-auth-manifest.json
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts emit-manifest
      - name: Upload immutable start-run authorization manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copper-turnstile-auth-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/copper-turnstile-auth-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Start approved batch (bounded integration-only per §2C)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          BATCH_ENTRIES: ${{ inputs.entries }}
          MERGE_METHOD: ${{ inputs.merge_method || 'squash' }}
          MANIFEST_PATH: ${{ runner.temp }}/copper-turnstile-auth-manifest.json
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts start

  advance-or-stop:
    name: Advance or reconcile active batch on PR/CI completion
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'pull_request_target' || github.event_name == 'workflow_run') &&
      vars.MERGE_QUEUE_BATCH_STATE != '' &&
      (contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"running"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"updating"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"awaiting_checks"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"merging"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"enqueuing"'))
    concurrency:
      # Single-writer FIFO serialization across all state-mutating jobs (queue: max, up to 100 pending); 15m watchdog recovers lost events.
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment: copper-turnstile-runtime
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Detect configured runtime credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip when runtime credentials are unavailable
        if: ${{ steps.cred_check.outputs.mode == 'none' }}
        run: echo "No Copper Turnstile runtime credential configured in copper-turnstile-runtime; skipping automatic advancement."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        with:
          # Always execute trusted coordinator scripts from default_branch (main). Never check out PR code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        with:
          node-version-file: .nvmrc
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Process PR closed wakeup
        if: ${{ steps.cred_check.outputs.mode != 'none' && github.event_name == 'pull_request_target' && github.event.action == 'closed' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_MERGED: ${{ github.event.pull_request.merged }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts advance
      - name: Process PR synchronize wakeup
        if: ${{ steps.cred_check.outputs.mode != 'none' && github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts sync
      - name: Process ordinary CI workflow_run completion wakeup
        if: ${{ steps.cred_check.outputs.mode != 'none' && github.event_name == 'workflow_run' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          EVENT_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts checks

  reconcile-watchdog:
    name: Watchdog recovery reconciliation for active batch
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'schedule' &&
      vars.MERGE_QUEUE_BATCH_STATE != '' &&
      (contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"running"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"updating"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"awaiting_checks"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"merging"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"enqueuing"'))
    concurrency:
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment: copper-turnstile-runtime
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Detect configured runtime credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip when runtime credentials are unavailable
        if: ${{ steps.cred_check.outputs.mode == 'none' }}
        run: echo "No Copper Turnstile runtime credential configured in copper-turnstile-runtime; skipping watchdog reconciliation."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        with:
          node-version-file: .nvmrc
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Reconcile active batch state
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts reconcile

  status:
    name: Report active batch status (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'status' }}
    concurrency:
      group: merge-queue-readonly-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Read batch status without write credentials
        env:
          BATCH_STATE_JSON: ${{ vars.MERGE_QUEUE_BATCH_STATE }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts status

  approve-reconcile:
    name: Owner approval gate for manual reconcile
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile' && github.ref == 'refs/heads/main' && github.actor == 'ContraPhilosophy' }}
    runs-on: ubuntu-24.04
    environment: merge-queue-approval
    permissions: {}
    steps:
      - name: Record owner approval checkpoint
        run: echo "Owner approval gate satisfied for manual reconcile run ${GITHUB_RUN_ID}."

  reconcile:
    name: Reconcile interrupted batch state
    needs: [approve-reconcile]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile' && github.ref == 'refs/heads/main' && github.actor == 'ContraPhilosophy' }}
    concurrency:
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment: copper-turnstile-runtime
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Detect configured runtime credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Copper Turnstile runtime credential configured in copper-turnstile-runtime."
            exit 1
          fi
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Reconcile batch state with live GitHub PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts reconcile --require-approval

  approve-abort:
    name: Owner approval gate for batch cancellation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'abort' && github.ref == 'refs/heads/main' && github.actor == 'ContraPhilosophy' }}
    runs-on: ubuntu-24.04
    environment: merge-queue-approval
    permissions: {}
    steps:
      - name: Record owner approval checkpoint
        run: echo "Owner approval gate satisfied for abort run ${GITHUB_RUN_ID}."

  abort:
    name: Cancel active or held batch
    needs: [approve-abort]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'abort' && github.ref == 'refs/heads/main' && github.actor == 'ContraPhilosophy' }}
    concurrency:
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment: copper-turnstile-runtime
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Detect configured runtime credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Copper Turnstile runtime credential configured in copper-turnstile-runtime."
            exit 1
          fi
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Cancel active batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          ABORT_REASON: ${{ inputs.reason || 'Aborted by operator' }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts abort
