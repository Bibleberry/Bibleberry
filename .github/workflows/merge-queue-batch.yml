name: Copper Turnstile Batch Coordinator

on:
  workflow_dispatch:
    inputs:
      action:
        description: Coordinator action to perform
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - start
          - status
          - reconcile
          - abort
      entries:
        description: Ordered PR_NUMBER@REVIEWED_HEAD_SHA list (comma or newline separated)
        type: string
        required: false
      merge_method:
        description: Protected PR merge method (must be allowed by repository settings)
        type: choice
        required: false
        default: squash
        options:
          - squash
          - merge
          - rebase
      reason:
        description: Optional reason (used for abort/cancellation)
        type: string
        required: false
  pull_request:
    types: [closed, synchronize]
    branches: [main]
  check_suite:
    types: [completed]
  schedule:
    # Watchdog reconciliation for active/interrupted batches (zero runners allocated when idle).
    - cron: '*/15 * * * *'

permissions: {}

jobs:
  preflight:
    name: Preflight batch entries (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.action == 'dry-run' || inputs.action == 'start') }}
    concurrency:
      group: merge-queue-readonly-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate batch entries (zero writes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_ENTRIES: ${{ inputs.entries }}
          MERGE_METHOD: ${{ inputs.merge_method || 'squash' }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts preflight --entries "$BATCH_ENTRIES" --merge-method "$MERGE_METHOD"

  authorize-and-start:
    name: Authorize and start direct-merge batch
    needs: [preflight]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'start' && github.ref == 'refs/heads/main' && github.actor == 'ContraPhilosophy' }}
    concurrency:
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment: merge-queue-approval
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Detect configured automation credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Copper Turnstile automation credential configured. Configure GitHub App (COPPER_TURNSTILE_APP_CLIENT_ID + COPPER_TURNSTILE_APP_PRIVATE_KEY) or MERGE_QUEUE_TOKEN. See docs/testing/merge-queue-integration.md."
            exit 1
          fi
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Start approved batch (default hold-on-update per §2C)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          BATCH_ENTRIES: ${{ inputs.entries }}
          MERGE_METHOD: ${{ inputs.merge_method || 'squash' }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts start --entries "$BATCH_ENTRIES" --merge-method "$MERGE_METHOD" --actor "${{ github.actor }}"

  advance-or-stop:
    name: Advance or reconcile active batch on PR/check events
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'check_suite') &&
      vars.MERGE_QUEUE_BATCH_STATE != '' &&
      (contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"running"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"updating"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"awaiting_checks"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"merging"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"enqueuing"'))
    concurrency:
      # Single-writer FIFO serialization across all state-mutating jobs (queue: max, up to 100 pending); 15m watchdog recovers lost webhooks or other failures.
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect configured automation credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip when automation credentials are unavailable
        if: ${{ steps.cred_check.outputs.mode == 'none' }}
        run: echo "No Copper Turnstile automation credential available in this event context; skipping automatic advancement."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        with:
          # Always run the trusted coordinator script from the default branch (main). Never check out PR code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        with:
          node-version: '24'
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Process PR closed event
        if: ${{ steps.cred_check.outputs.mode != 'none' && github.event_name == 'pull_request' && github.event.action == 'closed' }}
        env:
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          node --experimental-strip-types scripts/ci/merge-queue-batch.ts advance \
            --pr "${{ github.event.pull_request.number }}" \
            --merged "${{ github.event.pull_request.merged }}"
      - name: Process PR synchronize event
        if: ${{ steps.cred_check.outputs.mode != 'none' && github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
        env:
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          node --experimental-strip-types scripts/ci/merge-queue-batch.ts sync \
            --pr "${{ github.event.pull_request.number }}"
      - name: Process check_suite completion event
        if: ${{ steps.cred_check.outputs.mode != 'none' && github.event_name == 'check_suite' }}
        env:
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          node --experimental-strip-types scripts/ci/merge-queue-batch.ts checks \
            --head-sha "${{ github.event.check_suite.head_sha }}"

  reconcile-watchdog:
    name: Watchdog reconciliation for active batch
    if: >-
      github.event_name == 'schedule' &&
      vars.MERGE_QUEUE_BATCH_STATE != '' &&
      (contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"running"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"updating"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"awaiting_checks"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"merging"') ||
       contains(vars.MERGE_QUEUE_BATCH_STATE, '"status":"enqueuing"'))
    concurrency:
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect configured automation credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip when automation credentials are unavailable
        if: ${{ steps.cred_check.outputs.mode == 'none' }}
        run: echo "No Copper Turnstile automation credential configured; skipping watchdog reconciliation."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        with:
          node-version: '24'
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Reconcile active batch state
        if: ${{ steps.cred_check.outputs.mode != 'none' }}
        env:
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts reconcile

  status:
    name: Report active batch status (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'status' }}
    concurrency:
      group: merge-queue-readonly-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Read batch status without write credentials
        env:
          BATCH_STATE_JSON: ${{ vars.MERGE_QUEUE_BATCH_STATE }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts status

  reconcile:
    name: Reconcile interrupted batch state
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile' && github.ref == 'refs/heads/main' && github.actor == 'ContraPhilosophy' }}
    concurrency:
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment: merge-queue-approval
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Detect configured automation credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Copper Turnstile automation credential configured."
            exit 1
          fi
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Reconcile batch state with live GitHub PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: node --experimental-strip-types scripts/ci/merge-queue-batch.ts reconcile --require-approval --actor "${{ github.actor }}"

  abort:
    name: Cancel active or held batch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'abort' && github.ref == 'refs/heads/main' && github.actor == 'ContraPhilosophy' }}
    concurrency:
      group: merge-queue-batch-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment: merge-queue-approval
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Detect configured automation credentials
        id: cred_check
        env:
          HAS_APP: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID != '' && secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MERGE_QUEUE_TOKEN != '' }}
        run: |
          if [ "$HAS_APP" = "true" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = "true" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Copper Turnstile automation credential configured."
            exit 1
          fi
      - name: Mint repository-scoped GitHub App token
        id: app_token
        if: ${{ steps.cred_check.outputs.mode == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.COPPER_TURNSTILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COPPER_TURNSTILE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Cancel active batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPPER_TURNSTILE_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          ABORT_REASON: ${{ inputs.reason }}
        run: |
          node --experimental-strip-types scripts/ci/merge-queue-batch.ts abort \
            --actor "${{ github.actor }}" \
            --reason "${ABORT_REASON:-Aborted by operator}"
