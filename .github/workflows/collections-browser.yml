name: Collections Browser Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-collections:
    name: Saved Scripture and Field Notebook (Chromium)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run collection browser suites
        run: npm run test:collections

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collections-browser-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
