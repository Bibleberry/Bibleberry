name: Collections Browser Tests

on:
  pull_request:
    # Draft and Ready PRs both run scope-filtered read-only hosted CI; Draft PRs remain ineligible for merge/queue entry until review and owner promotion.
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  # Run Chromium regressions on the exact merge-queue integration commit.
  merge_group:
    types: [checks_requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-collections:
    name: Saved Scripture and Field Notebook (Chromium)
    # Hosted runner is isolated from persistent development machines.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Evaluate change scope
        id: scope
        run: node scripts/ci/check-scope.mjs --target collections-browser

      - name: Install dependencies
        if: steps.scope.outputs.should_run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.scope.outputs.should_run == 'true'
        run: npx playwright install chromium

      - name: Run collection browser suites
        if: steps.scope.outputs.should_run == 'true'
        run: npm run test:collections

      - name: Upload browser failure artifacts
        if: failure() && steps.scope.outputs.should_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collections-browser-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report skipped collection browser suites
        if: steps.scope.outputs.should_run != 'true'
        run: |
          echo "Change-scope skip (irrelevant files; not Draft PR suppression): Collection browser suites skipped because no collections or application source files changed."
