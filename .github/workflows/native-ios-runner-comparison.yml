        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: granite-lantern-ios-evidence-${{ env.DIAGNOSTIC_RUNNER }}-trial-${{ env.DIAGNOSTIC_TRIAL }}
          path: ${{ runner.temp }}/ios-simulator-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Upload development simulator app
        if: ${{ !cancelled() && steps.verify-app.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: granite-lantern-ios-app-${{ env.DIAGNOSTIC_RUNNER }}-trial-${{ env.DIAGNOSTIC_TRIAL }}
          path: ${{ runner.temp }}/BibleberryDerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
