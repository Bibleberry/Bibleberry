          uname -m > "$RUNNER_TEMP/ios-simulator-evidence/env/uname-m.txt"
          sw_vers > "$RUNNER_TEMP/ios-simulator-evidence/env/sw-vers.txt" || true
          cp -f "$RUNNER_TEMP"/runner-hardware.txt "$RUNNER_TEMP"/app-parity.txt "$RUNNER_TEMP"/xcode-*.txt "$RUNNER_TEMP"/simulator-runtimes*.txt "$RUNNER_TEMP"/ios-destinations-before-build.txt "$RUNNER_TEMP/ios-simulator-evidence/env/" 2>/dev/null || true
          python3 scripts/ios-simulator-snapshot.py "$RUNNER_TEMP/ios-simulator-evidence/env/simctl-devices-before.json"
          python3 scripts/ios-simulator-smoke.py \
            --app-path "$RUNNER_TEMP/BibleberryDerivedData/Build/Products/Debug-iphonesimulator/App.app" \
            --derived-data "$RUNNER_TEMP/BibleberryDerivedData" \
            --evidence-dir "$RUNNER_TEMP/ios-simulator-evidence"

      - name: Collect fallback CI diagnostics on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/ios-simulator-evidence/env"
          uname -m > "$RUNNER_TEMP/ios-simulator-evidence/env/uname-m.txt" || true
          sw_vers > "$RUNNER_TEMP/ios-simulator-evidence/env/sw-vers.txt" || true
          cp -f "$RUNNER_TEMP"/runner-hardware.txt "$RUNNER_TEMP"/app-parity.txt "$RUNNER_TEMP"/xcode-*.txt "$RUNNER_TEMP"/simulator-runtimes*.txt "$RUNNER_TEMP"/ios-destinations-before-build.txt "$RUNNER_TEMP/ios-simulator-evidence/env/" 2>/dev/null || true
          python3 scripts/ios-simulator-snapshot.py "$RUNNER_TEMP/ios-simulator-evidence/env/simctl-devices-after-failure.json"

