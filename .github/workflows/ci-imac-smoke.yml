name: iMac self-hosted runner smoke

# Manual-only infrastructure pilot. Never runs automatically on PRs or pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imac-runner-smoke
  cancel-in-progress: false

jobs:
  imac-smoke:
    name: Verify Bibleberry iMac runner
    runs-on: [self-hosted, macOS, ARM64, bibleberry-macos]
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Verify host and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          printf 'Runner: %s\n' "$RUNNER_NAME"
          sw_vers -productVersion
          uname -m

      - name: Verify Xcode and iOS simulator availability
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available | tee "$RUNNER_TEMP/available-simulators.txt"
          grep -Fq 'iPhone' "$RUNNER_TEMP/available-simulators.txt"
