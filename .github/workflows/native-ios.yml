name: Native iOS simulator build

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_lifecycle_probe:
        description: 'Build and run secondary test-only @capacitor/app lifecycle probe'
        type: boolean
        default: false

# Only PR runs share a concurrency group. Each main push and dispatch must run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scope:
    name: Determine iOS PR scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Classify complete PR and integration diffs
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/ios-scope.mjs

  ios-simulator:
    name: Signing-free iOS Simulator build
    needs: scope
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.scope != 'none') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Compile and verify the unsigned app and run smoke unit tests
        run: |
          source scripts/ci/build-ios-simulator.sh
          select_ios_xcode
          prepare_ios_project
          build_unsigned_ios_app "$RUNNER_TEMP/BibleberryDerivedData"
          verify_ios_bundle "$RUNNER_TEMP/BibleberryDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          run_ios_smoke_unit_tests

  ios-runtime:
    name: iOS Simulator runtime acceptance
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || (needs.scope.outputs.scope != 'none' && needs.scope.outputs.scope != 'build')) }}
    runs-on: macos-26
    outputs:
      build-proof: ${{ steps.smoke-unit-tests.outcome }}
      runtime-proof: ${{ steps.runtime-smoke.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Select and verify pinned Xcode and Simulator SDK
        run: |
          source scripts/ci/build-ios-simulator.sh
          select_ios_xcode
          xcrun simctl list runtimes | tee "$RUNNER_TEMP/simulator-runtimes-before.txt"

      - name: Provision iOS 26.4 Simulator runtime when missing
        run: |
          has_ios_26_4_runtime() {
            xcrun simctl list runtimes -j \
              | python3 -c 'import json,sys; runtimes=json.load(sys.stdin)["runtimes"]; sys.exit(0 if any(r["name"] == "iOS 26.4" and r["isAvailable"] for r in runtimes) else 1)'
          }

          if ! has_ios_26_4_runtime; then
            echo "IOS_RUNTIME_PROVISIONED=true" >> "$GITHUB_ENV"
            echo "iOS Simulator SDK 26.4 is present, but its runtime is missing; downloading the Xcode 26.4 runtime."
            RUNTIME_DIR="$RUNNER_TEMP/ios-simulator-runtime"
            mkdir -p "$RUNTIME_DIR"
            xcodebuild -downloadPlatform iOS \
              -buildVersion 26.4 \
              -exportPath "$RUNTIME_DIR"
            RUNTIME_DMG="$(find "$RUNTIME_DIR" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            if [ -z "$RUNTIME_DMG" ]; then
              echo "::error::Xcode did not export an iOS 26.4 Simulator runtime disk image."
              ls -la "$RUNTIME_DIR"
              exit 1
            fi
            xcodebuild -importPlatform "$RUNTIME_DMG"
          else
            echo "IOS_RUNTIME_PROVISIONED=false" >> "$GITHUB_ENV"
          fi

          xcrun simctl list runtimes | tee "$RUNNER_TEMP/simulator-runtimes.txt"
          if ! has_ios_26_4_runtime; then
            echo "::error::The iOS 26.4 Simulator runtime is still unavailable after provisioning."
            exit 1
          fi

      - name: Build web assets and sync Capacitor iOS project
        run: |
          source scripts/ci/build-ios-simulator.sh
          prepare_ios_project

      - name: Inspect iOS Simulator destinations
        run: |
          if ! xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -showdestinations \
            > "$RUNNER_TEMP/ios-destinations-before-build.txt" 2>&1; then
            cat "$RUNNER_TEMP/ios-destinations-before-build.txt"
            echo "::error::Xcode could not enumerate destinations after the iOS Simulator runtime check."
            exit 1
          fi
          cat "$RUNNER_TEMP/ios-destinations-before-build.txt"

      - name: Build unsigned iOS Simulator app
        run: |
          source scripts/ci/build-ios-simulator.sh
          build_unsigned_ios_app "$RUNNER_TEMP/BibleberryDerivedData"

      - name: Verify simulator app identity and web assets
        id: verify-app
        run: |
          source scripts/ci/build-ios-simulator.sh
          verify_ios_bundle "$RUNNER_TEMP/BibleberryDerivedData/Build/Products/Debug-iphonesimulator/App.app"

      - name: Run iOS simulator smoke unit tests
        id: smoke-unit-tests
        run: |
          source scripts/ci/build-ios-simulator.sh
          run_ios_smoke_unit_tests

      - name: Run iOS Simulator runtime smoke (install, launch, restart, UI lifecycle)
        id: runtime-smoke
        run: |
          mkdir -p "$RUNNER_TEMP/ios-simulator-evidence/env"
          uname -m > "$RUNNER_TEMP/ios-simulator-evidence/env/uname-m.txt"
          sw_vers > "$RUNNER_TEMP/ios-simulator-evidence/env/sw-vers.txt" || true
          cp -f "$RUNNER_TEMP"/xcode-*.txt "$RUNNER_TEMP"/simulator-runtimes*.txt "$RUNNER_TEMP"/ios-destinations-before-build.txt "$RUNNER_TEMP/ios-simulator-evidence/env/" 2>/dev/null || true
          python3 scripts/ios-simulator-snapshot.py "$RUNNER_TEMP/ios-simulator-evidence/env/simctl-devices-before.json"
          python3 scripts/ios-simulator-smoke.py \
            --app-path "$RUNNER_TEMP/BibleberryDerivedData/Build/Products/Debug-iphonesimulator/App.app" \
            --derived-data "$RUNNER_TEMP/BibleberryDerivedData" \
            --evidence-dir "$RUNNER_TEMP/ios-simulator-evidence"

      - name: Collect fallback CI diagnostics on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/ios-simulator-evidence/env"
          uname -m > "$RUNNER_TEMP/ios-simulator-evidence/env/uname-m.txt" || true
          sw_vers > "$RUNNER_TEMP/ios-simulator-evidence/env/sw-vers.txt" || true
          cp -f "$RUNNER_TEMP"/xcode-*.txt "$RUNNER_TEMP"/simulator-runtimes*.txt "$RUNNER_TEMP"/ios-destinations-before-build.txt "$RUNNER_TEMP/ios-simulator-evidence/env/" 2>/dev/null || true
          python3 scripts/ios-simulator-snapshot.py "$RUNNER_TEMP/ios-simulator-evidence/env/simctl-devices-after-failure.json"

      - name: Record runtime evidence provenance
        if: always()
        run: |
          evidence="$RUNNER_TEMP/ios-simulator-evidence"
          mkdir -p "$evidence"
          printf 'event=%s\nhead_sha=%s\nbuild_sha=%s\nrun_id=%s\nrun_attempt=%s\nsmoke_outcome=%s\n' \
            "$GITHUB_EVENT_NAME" "$HEAD_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "${{ steps.runtime-smoke.outcome }}" > "$evidence/ci-provenance.txt"

      - name: Upload iOS Simulator runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bibleberry-r20-4-ios-simulator-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-simulator-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Upload development simulator app
        if: ${{ !cancelled() && steps.verify-app.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bibleberry-r20-3-ios-simulator-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/BibleberryDerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7

      - name: Build and probe test-only @capacitor/app registration in iOS Simulator
        id: lifecycle-probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_lifecycle_probe == true }}
        env:
          VITE_ENABLE_NATIVE_LIFECYCLE_PROBE: 'true'
        run: |
          source scripts/ci/build-ios-simulator.sh
          evidence="$RUNNER_TEMP/ios-simulator-lifecycle-probe-evidence"
          mkdir -p "$evidence"
          printf 'event=%s\nhead_sha=%s\nbuild_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_EVENT_NAME" "$HEAD_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$evidence/ci-provenance.txt"
          npm run build
          npx cap sync ios
          build_unsigned_ios_app "$RUNNER_TEMP/BibleberryLifecycleProbeDerivedData"
          python3 scripts/ios-simulator-smoke.py \
            --lifecycle-probe-only \
            --app-path "$RUNNER_TEMP/BibleberryLifecycleProbeDerivedData/Build/Products/Debug-iphonesimulator/App.app" \
            --evidence-dir "$evidence"

      - name: Upload iOS Simulator lifecycle probe evidence
        if: ${{ !cancelled() && (steps.lifecycle-probe.outcome == 'success' || steps.lifecycle-probe.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bibleberry-r20-4-ios-lifecycle-probe-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-simulator-lifecycle-probe-evidence
          if-no-files-found: warn
          retention-days: 7

  ios-summary:
    name: iOS verification summary
    if: always()
    needs: [scope, ios-simulator, ios-runtime]
    runs-on: ubuntu-24.04
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      PR_SCOPE: ${{ needs.scope.outputs.scope }}
      SCOPE_REASON: ${{ needs.scope.outputs.reason }}
      BUILD_RESULT: ${{ needs.ios-simulator.result }}
      RUNTIME_RESULT: ${{ needs.ios-runtime.result }}
      RUNTIME_BUILD_PROOF: ${{ needs.ios-runtime.outputs.build-proof }}
      RUNTIME_SMOKE_PROOF: ${{ needs.ios-runtime.outputs.runtime-proof }}
    steps:
      - name: Report iOS proof for this commit
        run: |
          build_required=false
          runtime_required=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            build_required=true
            if [[ "$SCOPE_RESULT" == success ]]; then
              case "$PR_SCOPE" in
                none) build_required=false; runtime_required=false ;;
                build) runtime_required=false ;;
              esac
            else
              SCOPE_REASON='Scope job did not succeed; full runtime required'
            fi
          else
            SCOPE_REASON='Full acceptance for main pushes and manual runs'
          fi

          failed=0
          if [[ "$BUILD_RESULT" == success || ( "$GITHUB_EVENT_NAME" != pull_request && "$RUNTIME_BUILD_PROOF" == success ) ]]; then
            build_status='iOS Build Passed'
          elif [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            build_status="No passing build proof from the runtime job (${RUNTIME_BUILD_PROOF:-unavailable})"
            failed=1
          elif [[ "$build_required" == false && "$BUILD_RESULT" == skipped ]]; then
            build_status='Not run / Not required for this PR'
          else
            build_status="No passing build proof ($BUILD_RESULT)"
            failed=1
          fi

          if [[ "$RUNTIME_RESULT" == success && "$RUNTIME_SMOKE_PROOF" == success ]]; then
            runtime_status='iOS Runtime Verified'
          elif [[ "$runtime_required" == false && "$RUNTIME_RESULT" == skipped ]]; then
            runtime_status='Not run / Not required for this PR'
          else
            runtime_status="No passing runtime proof ($RUNTIME_RESULT)"
            failed=1
          fi

          {
            printf '## iOS verification\n\n'
            printf -- '- Event: %s\n- PR head or run commit: `%s`\n- Build/integration SHA: `%s`\n' \
              "$GITHUB_EVENT_NAME" "$HEAD_SHA" "$GITHUB_SHA"
            printf -- '- Scope: %s\n- Build: **%s**\n- Runtime: **%s**\n' \
              "${SCOPE_REASON:-Scope missing; full runtime required}" "$build_status" "$runtime_status"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"
