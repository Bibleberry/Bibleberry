name: Native Android debug build

on:
  pull_request:
    # Keep native build jobs in the Draft-PR waiting room.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
    paths:
      - android/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      # Vite/Capacitor packages current web app assets into the native APK.
      - src/**
      - public/**
      - index.html
      - vite.config.*
      - src/participation/drivers/capacitorPreferencesDriver.ts
      - src/participation/defaultGuestStore.ts
      - .github/workflows/native-android.yml
  push:
    branches: [main]
    paths:
      - android/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      # Vite/Capacitor packages current web app assets into the native APK.
      - src/**
      - public/**
      - index.html
      - vite.config.*
      - src/participation/drivers/capacitorPreferencesDriver.ts
      - src/participation/defaultGuestStore.ts
      - .github/workflows/native-android.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Native Android debug APK
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # Only owner-authored internal PRs and pushes run code on persistent machines.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'ContraPhilosophy')) && fromJSON('["self-hosted","Linux","X64","bibleberry-linux"]') || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Shared SDK/Gradle caches should stay local on persistent Linux runners.
          cache: ${{ runner.environment == 'github-hosted' && 'gradle' || '' }}
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Use persistent runner-specific Android SDK
        if: ${{ runner.environment == 'self-hosted' }}
        run: echo "ANDROID_SDK_ROOT=$HOME/.android/sdk-$RUNNER_NAME" >> "$GITHUB_ENV"

      # Hosted images already contain SDK tools; our Ubuntu VM does not.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36 and Build Tools
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build and test Android debug variant
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Verify APK identity and packaged web assets
        env:
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | grep -F "package: name='com.example.bibleberry.r20poc'"
          unzip -Z1 "$APK" | grep -Fx 'assets/public/index.html'
          echo "Build SHA: $GITHUB_SHA"
          echo "APK size: $(stat -c '%s' "$APK") bytes"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bibleberry-r20-2a-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
