name: Native Android debug build

on:
  pull_request:
    branches: [main]
    paths:
      - android/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - src/participation/drivers/capacitorPreferencesDriver.ts
      - src/participation/defaultGuestStore.ts
      - .github/workflows/native-android.yml
  push:
    branches: [main]
    paths:
      - android/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - src/participation/drivers/capacitorPreferencesDriver.ts
      - src/participation/defaultGuestStore.ts
      - .github/workflows/native-android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Native Android debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build and test Android debug variant
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Verify APK identity and packaged web assets
        env:
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | grep -F "package: name='com.example.bibleberry.r20poc'"
          unzip -Z1 "$APK" | grep -Fx 'assets/public/index.html'
          echo "Build SHA: $GITHUB_SHA"
          echo "APK size: $(stat -c '%s' "$APK") bytes"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bibleberry-r20-2a-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
