name: Native Android debug build

on:
  pull_request:
    # Keep native build jobs in the Draft-PR waiting room.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
    paths:
      - android/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      # Vite/Capacitor packages current web app assets into the native APK.
      - src/**
      - public/**
      - index.html
      - vite.config.*
      - src/participation/drivers/capacitorPreferencesDriver.ts
      - src/participation/defaultGuestStore.ts
      - .github/workflows/native-android.yml
  push:
    branches: [main]
    paths:
      - android/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      # Vite/Capacitor packages current web app assets into the native APK.
      - src/**
      - public/**
      - index.html
      - vite.config.*
      - src/participation/drivers/capacitorPreferencesDriver.ts
      - src/participation/defaultGuestStore.ts
      - .github/workflows/native-android.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Native Android debug APK
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # GitHub-hosted Ubuntu isolates PR builds from local development computers.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # Prepare command-line tools consistently on hosted Ubuntu.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK Platform 36 and Build Tools
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build and test Android debug variant
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Verify APK identity and packaged web assets
        env:
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | grep -F "package: name='com.example.bibleberry.r20poc'"
          unzip -Z1 "$APK" | grep -Fx 'assets/public/index.html'
          echo "Build SHA: $GITHUB_SHA"
          echo "APK size: $(stat -c '%s' "$APK") bytes"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bibleberry-r20-2a-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
